name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Format and JavaScript
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git qt6-declarative nodejs deno make findutils diffutils
      - uses: actions/checkout@v4
      - name: Format check
        run: make fmt-check
      - name: JavaScript lint
        run: make lint-js
      - name: JavaScript tests
        run: make test

  qml:
    name: QML lint and runtime (Arch)
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 45
    steps:
      - name: Install QML and runtime dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git sudo qt6-declarative qt6-multimedia qt6-svg qt6-wayland nodejs deno make findutils diffutils dbus python python-dbus python-gobject hyprland weston wayland wayland-utils mesa
          useradd -m -G wheel builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
      - uses: actions/checkout@v4
      - name: Build Quickshell from AUR
        run: |
          runuser -u builder -- sh -c 'cd /tmp && git clone --depth 1 https://aur.archlinux.org/quickshell-git.git && cd quickshell-git && makepkg -s --noconfirm --needed'
          pacman -U --noconfirm /tmp/quickshell-git/*.pkg.tar.zst
      - name: QML static lint
        run: make lint-qml
      - name: QML runtime tests and smoke in headless Wayland
        run: |
          export XDG_RUNTIME_DIR=/tmp/notch-ci-runtime
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          mkdir -p /tmp/opencode
          chown builder:builder "$XDG_RUNTIME_DIR" /tmp/opencode
          runuser -u builder -- dbus-run-session -- sh -ec '
            export XDG_RUNTIME_DIR=/tmp/notch-ci-runtime
            export AQ_NO_KMS_REQUIREMENT=1
            export AQ_TRACE=1
            export AQ_LOG_LEVEL=trace
            export HYPRLAND_TRACE=1
            export HYPRLAND_NO_CRASHREPORTER=1
            export LIBGL_ALWAYS_SOFTWARE=1
            export WLR_NO_HARDWARE_CURSORS=1
            export QT_QUICK_BACKEND=software
            export XDG_CURRENT_DESKTOP=Hyprland
            export XDG_SESSION_TYPE=wayland
            weston --backend=headless --socket=notch-parent --idle-time=0 --log=/tmp/notch-weston.log &
            parent=$!
            trap "kill $parent 2>/dev/null || true" EXIT
            attempt=0
            until [ -S "$XDG_RUNTIME_DIR/notch-parent" ]; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 50 ]; then cat /tmp/notch-weston.log; exit 1; fi
              sleep 0.2
            done
            export WAYLAND_DISPLAY=notch-parent
            echo "=== Runtime and graphics devices ==="
            id
            printf "XDG_RUNTIME_DIR=%s WAYLAND_DISPLAY=%s\\n" "$XDG_RUNTIME_DIR" "$WAYLAND_DISPLAY"
            ls -ld "$XDG_RUNTIME_DIR" /dev/dri /dev/dri/* 2>&1 || true
            echo "=== Parent Wayland connection ==="
            if ! wayland-info > /tmp/notch-parent-info.log 2>&1; then
              cat /tmp/notch-parent-info.log
              echo "ERROR: builder cannot connect to the Weston Wayland socket"
              exit 1
            fi
            grep -E "wl_compositor|wl_shm|wl_output|xdg_wm_base" /tmp/notch-parent-info.log || true
            echo "=== EGL environment ==="
            env | grep -E "^(AQ_|EGL_|GBM_|LIBGL_|MESA_|WAYLAND_|XDG_)" | sort
            printf "debug {\n    disable_logs = false\n    enable_stdout_logs = true\n}\nmonitor = ,1280x720@60,0x0,1\n" > /tmp/notch-hyprland.conf
            WAYLAND_DEBUG=client Hyprland --config /tmp/notch-hyprland.conf > /tmp/notch-hyprland.log 2>&1 &
            compositor=$!
            trap "kill $compositor 2>/dev/null || true; kill $parent 2>/dev/null || true" EXIT
            export QT_QPA_PLATFORM=wayland
            attempt=0
            until [ -n "$(find "$XDG_RUNTIME_DIR" -maxdepth 1 -type s -name 'wayland-*' ! -name notch-parent -print -quit)" ]; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 50 ]; then echo "=== Hyprland stdout ==="; cat /tmp/notch-hyprland.log; echo "=== Hyprland detailed logs ==="; find "$XDG_RUNTIME_DIR" /tmp -name hyprland.log -type f -exec tail -n 200 {} \; 2>/dev/null || true; echo "=== Weston ==="; tail -n 80 /tmp/notch-weston.log; exit 1; fi
              sleep 0.2
            done
            export WAYLAND_DISPLAY="$(basename "$(find "$XDG_RUNTIME_DIR" -maxdepth 1 -type s -name 'wayland-*' ! -name notch-parent -print -quit)")"
            echo "Wayland globals:"
            wayland-info | grep -E "zwlr_layer_shell_v1|wl_output|wl_seat" || true
            if ! wayland-info | grep -q zwlr_layer_shell_v1; then
              echo "ERROR: compositor does not advertise zwlr_layer_shell_v1"
              cat /tmp/notch-hyprland.log
              exit 1
            fi
            make qml-test
            make smoke
          '
