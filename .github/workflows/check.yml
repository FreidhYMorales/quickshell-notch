name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Format and JavaScript
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git qt6-declarative nodejs deno make findutils diffutils
      - uses: actions/checkout@v4
      - name: Format check
        run: make fmt-check
      - name: JavaScript lint
        run: make lint-js
      - name: JavaScript tests
        run: make test

  qml:
    name: QML lint and runtime (Arch)
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 45
    steps:
      - name: Install QML and runtime dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git sudo qt6-declarative qt6-multimedia qt6-svg qt6-wayland nodejs deno make findutils diffutils dbus python python-dbus python-gobject sway wayland wayland-utils mesa
          useradd -m -G wheel builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
      - uses: actions/checkout@v4
      - name: Build Quickshell from AUR
        run: |
          runuser -u builder -- sh -c 'cd /tmp && git clone --depth 1 https://aur.archlinux.org/quickshell-git.git && cd quickshell-git && makepkg -s --noconfirm --needed'
          pacman -U --noconfirm /tmp/quickshell-git/*.pkg.tar.zst
      - name: QML static lint
        run: make lint-qml
      - name: QML runtime tests and smoke in headless Wayland
        run: |
          export XDG_RUNTIME_DIR=/tmp/notch-ci-runtime
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          mkdir -p /tmp/opencode
          dbus-run-session -- sh -ec '
            export WLR_BACKENDS=headless
            export WLR_HEADLESS_OUTPUTS=1
            export WLR_LIBINPUT_NO_DEVICES=1
            export WLR_RENDERER=pixman
            export QT_QUICK_BACKEND=software
            printf "output HEADLESS-1 resolution 1280x720\\n" > /tmp/notch-sway.conf
            sway -c /tmp/notch-sway.conf --debug > /tmp/notch-sway.log 2>&1 &
            compositor=$!
            trap "kill $compositor 2>/dev/null || true" EXIT
            export QT_QPA_PLATFORM=wayland
            export WAYLAND_DISPLAY=wayland-1
            attempt=0
            until [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 50 ]; then cat /tmp/notch-sway.log; exit 1; fi
              sleep 0.2
            done
            echo "Wayland globals:"
            wayland-info | grep -E "zwlr_layer_shell_v1|wl_output|wl_seat" || true
            if ! wayland-info | grep -q zwlr_layer_shell_v1; then
              echo "ERROR: compositor does not advertise zwlr_layer_shell_v1"
              cat /tmp/notch-sway.log
              exit 1
            fi
            make qml-test
            make smoke
          '
